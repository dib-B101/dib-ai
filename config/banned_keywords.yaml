# 1차 규칙 필터 금칙어 사전
#
# 여기 걸리면 AI 를 부르지 않고 즉시 차단한다. 그래서 **명확한 것만** 넣는다.
# 애매한 표현은 넣지 말고 LLM 이 문맥으로 판단하게 둔다 — 오탐이 곧 정상 상품
# 등록 차단이고, 그건 이 기능의 목표(오탐 최소화)에 정면으로 반한다.
#
# 매칭 전에 정규화를 거치므로 "전.자.담.배", "ㄷㅏㅁㅂㅐ" 같은 우회는 자동으로 잡힌다.
# 사전에는 정상 표기만 넣으면 된다.
#
# 부분 문자열로 매칭되므로 짧은 단어는 조심한다. 예를 들어 "술" 을 넣으면
# "기술서적", "마술도구" 가 전부 걸린다.

version: "keywords-v1"

categories:
  담배:
    - 담배
    - 전자담배
    - 액상니코틴
    - 니코틴액상
    - 말보로
    - 던힐
    - 아이코스
    - 릴하이브리드
    - 쥴팟

  주류:
    - 소주
    - 맥주
    - 위스키
    - 발렌타인
    - 로얄살루트
    - 조니워커
    - 양주
    - 와인
    - 막걸리

  의약품:
    - 전문의약품
    - 처방전
    - 항생제
    - 스테로이드
    - 다이어트약
    - 발기부전
    - 비아그라
    - 프로포폴
    - 졸피뎀

  마약류:
    - 대마
    - 대마초
    - 필로폰
    - 엑스터시
    - 케타민
    - 아이스작대기

  무기류:
    - 실탄
    - 총포
    - 도검
    - 사시미칼
    - 전기충격기
    - 삼단봉
    - 너클

  개인정보:
    - 주민등록증
    - 운전면허증
    - 여권사본
    - 계정판매
    - 실명인증
    - 명의대여

  위조품:
    - 이미테이션
    - 레플리카
    - 짝퉁
    - 미러급
    - sa급

  동물:
    - 강아지분양
    - 고양이분양
    - 파충류분양
    - 야생동물

  기타:
    - 장기매매
    - 대리시험
    - 논문대필
    - 상품권깡
    - 카드깡


# 의심 낱말 — **차단하지 않고 AI 에 넘긴다.**
#
# 위 `categories` 는 낱말만으로 위반이 확정되는 것들이다. 여기 있는 것은 다르다.
# `강쥐` 는 살아있는 강아지일 수도 강아지 인형일 수도 있고, `포메라니안` 은 품종명
# 이라 방석·옷·사료에도 그대로 붙는다. 제목에 있어도 차단하지 않는다.
#
# **그럼 왜 사전에 두는가.** 걸린 낱말이 힌트로 LLM 에 전달되어 그 부분을 주의해서
# 보게 만든다. 사전에 없으면 모델이 힌트 없이 지나칠 수 있다.
#
# 여기에 넣을 낱말의 기준은 하나다 — **정상 상품에도 쓰이는 말인가.**
# 그렇다면 의심, 아니라면 위 `categories`.
suspect:
  동물:
    # 애칭 · 구어. "강쥐 인형", "냥이 스크래처" 처럼 용품에도 붙는다
    - 강쥐
    - 댕댕이
    - 멍멍이
    - 냥이
    - 고양이
    - 강아지
    - 햄스터
    - 앵무새
    - 고슴도치

    # 품종명. 방석·옷·사료·굿즈에 그대로 붙는 말이다
    - 포메라니안
    - 말티즈
    - 비숑
    - 푸들
    - 시바견
    - 리트리버
    - 먼치킨
    - 러시안블루
    - 스코티시폴드

    # 거래를 암시하지만 다른 뜻으로도 쓰인다
    # ("아파트 분양", "가정집에서 키우던 화분")
    - 분양
    - 입양
    - 데려가실
    - 새끼
