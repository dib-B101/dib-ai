# 규칙 기반 이상거래 탐지 설정
#
# 이 파일의 값만 바꾸면 코드 수정 없이 임계값을 조정할 수 있다.
# version 을 함께 올려야 과거 판정을 나중에 해석할 수 있다.

version: "rules-v3"

# 경매 단위 최소 분석 조건. 미달이면 그 경매는 탐지하지 않는다.
# 근거: 입찰자가 적으면 bidding_ratio 가 기계적으로 커진다 (2명이면 0.5).
gates:
  min_bids: 4
  min_bidders: 3

rules:

  # ------------------------------------------------------------------
  # R1. 재탈환 속도
  #
  # 원 티켓의 "짧은 시간의 반복 입찰" 을 우리 정책에 맞게 재정의한 것.
  # 우리는 최고 입찰자의 연속 입찰이 막혀 있어 A→A→A 가 구조적으로 불가능하다.
  # 따라서 실제로 잴 수 있는 것은 "빼앗기자마자 얼마나 빨리 되찾는가" 이며,
  # 이 값이 짧고 균일하면 자동화 또는 계정 간 핑퐁을 의심한다.
  # ------------------------------------------------------------------
  R1_RECLAIM_SPEED:
    enabled: true
    weight: 0.25
    params:
      min_reclaims: 2       # 재탈환 횟수가 이보다 적으면 판단하지 않는다

      # "빠른 재탈환" 의 기준은 경매 길이(auction.auction_time)에 비례한다.
      # 절대 초로 박으면 3분짜리 라이브 경매에서는 거의 모든 입찰이 "빠름" 이 되고,
      # 며칠짜리 경매에서는 아무것도 걸리지 않는다.
      #   3분  경매 -> 180 * 0.05 =   9초
      #   1시간 경매 -> 3600 * 0.05 = 180초 -> cap 적용 120초
      fast_ratio: 0.05
      min_fast_seconds: 5     # 너무 짧은 경매에서 0 에 수렴하는 것을 막는다
      max_fast_seconds: 120   # 긴 경매에서 무한정 늘어나는 것을 막는다

      dispersion_threshold: 1.0   # 간격 산포도(MAD/중앙값)가 이보다 작으면 균일하다고 본다
      uniformity_influence: 0.3   # 균일성이 속도 점수를 최대 30%까지 조절한다

  # ------------------------------------------------------------------
  # R2. 경매 내 입찰 독식
  #
  # 우리 정책상 한 사람의 입찰 비중 상한은 (n+1)/2n 이다 (n = 총 입찰 수).
  # 그래서 원시 비율이 아니라 "균등 참여 대비 상한까지의 위치" 로 정규화한다.
  # ------------------------------------------------------------------
  R2_BID_DOMINANCE:
    enabled: true
    weight: 0.25
    params: {}

  # ------------------------------------------------------------------
  # R3. 신규 계정의 고액 입찰
  #
  # 신규성과 공격성을 곱한다. 둘 다 커야 점수가 남는다.
  # 신규지만 소액이거나, 고액이지만 오래된 계정이면 0 에 가깝다.
  # ------------------------------------------------------------------
  R3_NEW_ACCOUNT_HIGH_BID:
    enabled: true
    weight: 0.15
    params:
      new_account_days: 7     # 가입 후 이 기간 이내를 신규로 본다
      high_multiple: 3.0      # 시작가의 몇 배까지 올렸을 때 최대 점수인가

  # ------------------------------------------------------------------
  # R4. 구독하지 않은 판매자에게 편중
  #
  # 라이브 방송 구독 모델에서는 구독자가 좋아하는 방송자의 경매에만 참여하는 것이
  # 정상이다. 편중도만 보면 충성 고객이 그대로 고위험으로 찍히므로,
  # 구독 관계가 있으면 이 규칙은 판단하지 않는다(0 점이 아니라 skip).
  #
  # 같은 이유로 ML 트랙에서도 Bidder_Tendency 를 제외했다. 두 트랙이 같은 신호를
  # 반대로 해석하면 구독자가 한쪽에서만 고위험으로 나온다.
  #
  # 참여 이력이 적으면 우연히 편중돼 보이므로 신뢰도로 보정한다.
  # ------------------------------------------------------------------
  R4_SELLER_CONCENTRATION:
    enabled: true
    weight: 0.20
    params:
      skip_if_subscribed: true  # 구독 중인 판매자면 판단하지 않는다
      min_auctions: 3           # 과거 참여가 이보다 적으면 판단하지 않는다
      reliable_auctions: 8      # 이 정도 참여해야 편중도를 그대로 신뢰한다

  # ------------------------------------------------------------------
  # R5. 동일 환경 다계정 (비활성)
  #
  # device fingerprint / IP 를 수집하지 않으므로 계산이 불가능하다.
  # 수집 여부는 개인정보 처리방침과 함께 결정되어야 하며,
  # IP 는 공유 와이파이·통신사 NAT 때문에 오탐이 많아 단독 판정 근거로 쓸 수 없다.
  # 수집이 결정되면 enabled 만 true 로 바꾸고 규칙을 구현한다.
  # ------------------------------------------------------------------
  R5_MULTI_ACCOUNT:
    enabled: false
    weight: 0.0
    params: {}

  # ------------------------------------------------------------------
  # R6. 종료 직전 급등
  #
  # 기준 시각은 ended_at 이 아니라 started_at + auction_time 이다.
  # 연장이 발생하면 ended_at 이 뒤로 밀려서 같은 입찰이 경매마다 다른 비율로
  # 계산된다. auction_time 은 생성 시 확정되고 연장해도 바뀌지 않으므로
  # 최초 예정 종료시각을 항상 같은 값으로 복원할 수 있다.
  #
  # 상승분 중 이 입찰자가 올린 몫만큼만 책임을 지운다.
  # ------------------------------------------------------------------
  R6_LATE_SURGE:
    enabled: true
    weight: 0.15
    params:
      # "종료 직전" 도 경매 길이에 비례한다.
      # 3분 경매에 window 를 5분으로 두면 경매 전체가 "종료 직전" 이 된다.
      #   3분   경매 -> 180 * 0.15 =  27초
      #   6시간 경매 -> 21600 * 0.15 = 3240초 -> cap 적용 600초
      window_ratio: 0.15
      min_window_seconds: 10
      max_window_seconds: 600

      surge_threshold: 0.30   # 이 비율 이상 오르면 급등으로 본다 (30%)

# 관리자 검토 큐 구간. 정책 문서의 낮음/중간/높음에 대응한다.
# 자동 제재에는 사용하지 않는다.
bands:
  low: [0.0, 0.3]
  medium: [0.3, 0.6]
  high: [0.6, 1.01]
