# 추천 랭킹 설정.
#
# 모든 값은 초기 가설값이다. 근거는 "구매 의사에 가까울수록 크게" 라는 상식적 순서이며,
# 행동 로그와 입찰 전환율이 쌓이면 조정한다. version 이 추천 응답에 함께 나가므로
# 값을 바꿔도 과거 결과를 해석할 수 있다.

version: "reco-v1"

# 마감 임박도
#
#   urgency = exp(-남은시간 / tau)
#
# 역수(1/남은시간)로 정의하면 1초 남은 경매가 무한대가 되어 다른 항을 전부 눌러버린다.
# 지수 형태는 남은 시간이 0 에 가까워져도 1 로 수렴한다.
#
# tau 가 3600 이면 1시간 남았을 때 0.37, 10분 남았을 때 0.85 다.
urgency:
  tau_seconds: 3600

# 인기도 · 경쟁도를 구성하는 항.
#
# 각 항은 후보 집합 내 백분위로 정규화한 뒤 합친다. 조회수는 수만, 입찰수는 수백이라
# 원값을 그대로 더하면 스케일이 큰 항이 가중치와 무관하게 지배한다.
popularity:
  view_count: 0.4
  bookmark_count: 0.6      # 찜이 조회보다 강한 신호다

competition:
  bid_count: 0.4
  bidder_count: 0.6        # 한 명이 여러 번 부른 것보다 여러 명이 붙은 쪽이 강하다

# 최종 점수의 가중치. 합이 1 이 되도록 둔다.
#
# 마감 임박에 가장 큰 무게를 주는 이유는 경매의 특성 때문이다. 곧 끝나는 경매는
# 지금 보지 않으면 기회 자체가 사라지지만, 인기 있는 상품은 나중에 봐도 된다.
weights:
  urgency: 0.4
  popularity: 0.3
  competition: 0.3

# 한 번에 돌려줄 최대 개수.
limit: 50

# 유사 상품 추천에서 유사도가 차지하는 비중.
#
#   최종 = weight × 유사도 + (1 − weight) × (마감임박 · 인기도 · 경쟁도)
#
# 유사하기만 하고 아무도 안 보는 경매를 위로 올리면 안 되고, 반대로 인기만 보면
# 취향과 무관한 상품이 올라온다. 절반씩 섞어 시작한다.
similarity:
  weight: 0.5

  # 텍스트와 이미지 유사도의 비율. 중고 거래에서는 모델명·상태·구성품 같은
  # 결정적 정보가 대부분 텍스트에 있다.
  text: 0.6

# 개인화 (STEP 5).
#
# 행동 로그에서 관심 프로필을 만들 때 쓴다. 로그가 없으면 프로필이 안 만들어지고
# 자동으로 인기순으로 떨어지므로, 값이 틀려도 서비스가 죽지는 않는다.
personalization:
  # 최종 점수에서 개인 취향이 차지하는 비중.
  #
  #   최종 = weight × 프로필 유사도 + (1 − weight) × (마감임박 · 인기도 · 경쟁도)
  #
  # 유사 상품(0.5)보다 낮게 잡는다. 유사 상품은 "지금 이걸 보고 있다" 는 확실한
  # 신호지만, 관심 프로필은 과거 행동에서 추정한 값이라 덜 확실하다.
  weight: 0.4

  # 관심이 절반으로 줄어드는 기간(일).
  #
  # 중고 거래는 필요가 생겼다 사라지는 주기가 짧다. 한 달 전에 냉장고를 찾아본
  # 사람에게 지금도 냉장고를 보여주면 이미 산 물건을 계속 권하는 셈이다.
  half_life_days: 14

  # 프로필을 만들 때 볼 기간(일). 이보다 오래된 행동은 조회하지 않는다.
  lookback_days: 90

  # 한 번에 읽을 최대 이벤트 수. 헤비 유저의 로그가 수만 건이어도 응답이 늦지 않게.
  max_events: 500

  # 행동별 관심 가중치. 구매 의사에 가까울수록 크게 준다.
  #
  # 음의 신호는 조심해서 쓴다. 찜 해제는 이전 찜을 되돌리는 명시적 행동이라 빼는
  # 것이 맞지만, 스크롤로 지나친 것은 관심이 없어서일 수도 이미 아는 상품이어서일
  # 수도 있다. 한 번 지나쳤다고 싫어한다고 보면 오탐이 쌓인다.
  events:
    BID: 6.0
    PURCHASE: 6.0
    WATCH: 4.0          # 찜
    SEARCH: 2.0
    CLICK: 2.0
    SHARE: 2.0
    VIEW: 1.0
    IMPRESSION: 0.0     # 노출됐을 뿐. 관심의 증거가 아니다
    SCROLL_PASS: -0.5
    UNWATCH: -4.0       # 찜 해제. 같은 크기로 되돌린다
